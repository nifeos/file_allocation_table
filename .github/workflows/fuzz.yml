name: fuzz
on:
  schedule:
    - cron: '45 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    uses: nifeos/crate-workflows/.github/workflows/fuzz.yml@e9723181c6dd4793fc011549548228009248f08f
    with:
      # Crash inputs are public. Set true only for a crate with no unsafe code.
      public-crash-inputs: true

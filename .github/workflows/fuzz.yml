name: fuzz
on:
  schedule:
    - cron: '45 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    uses: partsfoundry/crate-workflows/.github/workflows/fuzz.yml@d4cebb418a29be33a71ba0b4506ccf4ec0092d8e
    with:
      # Crash inputs are public. Set true only for a crate with no unsafe code.
      public-crash-inputs: true

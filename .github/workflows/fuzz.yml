name: fuzz
on:
  schedule:
    - cron: '45 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    uses: partsfoundry/crate-workflows/.github/workflows/fuzz.yml@eef0a564a45656471bedcb93e4789f507387bc89
    with:
      # Crash inputs are public. Set true only for a crate with no unsafe code.
      public-crash-inputs: true

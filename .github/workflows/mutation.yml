name: mutation
on:
  schedule:
    # This repository's own weekday, tried at 08, 10 and 12 UTC.
    - cron: '5 8,10,12 * * 3'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutation:
    # issues: write lets a red run file the crate's issue and a green one close it; without it the
    # run still runs and the filing ends in a warning.
    permissions:
      contents: read
      issues: write
    uses: partsfoundry/crate-workflows/.github/workflows/mutation.yml@eef0a564a45656471bedcb93e4789f507387bc89

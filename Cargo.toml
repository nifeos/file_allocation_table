[package]
name = "file_allocation_table"
version = "0.1.0-pre.1"
edition = "2024"
rust-version = "1.88"
description = "FAT12, FAT16 and FAT32 sans I/O: read, write and format volumes, with Kani-proven parsers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nifeos/file_allocation_table"
readme = "README.md"
keywords = ["fat", "fat32", "vfat", "no-std", "filesystem"]
categories = ["no-std", "filesystem", "embedded"]
# What the package carries: the crate, its tests, fixtures and examples, the falsification patches
# that the README tells a reader to apply, and the licenses. The repository's workflows, hooks,
# fuzz targets, process documents and lint settings stay out.
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/falsifications/**",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

# FAT12, FAT16 and FAT32 (Microsoft's "FAT: General Overview of On-Disk Format", version 1.03), as
# pure computation. No I/O of any kind: the reader takes sectors from a caller's `SectorDevice`,
# and the writer says what every sector of its one volume must contain and the caller writes them.
# So it compiles for the host and its tests run in milliseconds.

# The default build has no dependency. `embedded-io` is the one dependency the maintainers
# approved, on 2026-11-12, for the `embedded-io-07` feature only: with it on, the file reader and
# writer implement the `embedded-io` 0.7 traits (`Read`, `Write`, `Seek` and `ErrorType`), and it
# is off by default. A later `embedded-io` major version gets a feature of its own beside this
# one, as postcard keeps `embedded-io-04` and `embedded-io-06`, so a caller on either version is
# served and no feature changes meaning. MIT OR Apache-2.0, `no_std`, and no default features.
[features]
default = []
embedded-io-07 = ["dep:embedded-io"]

[dependencies]
embedded-io = { version = "0.7", optional = true, default-features = false }

# The independent FAT library the tests compare against, and nothing else: rust-fatfs's main line,
# republished on crates.io as `lamfat` (MIT). Pinned to one version, and its checksum is in
# Cargo.lock. It never builds into anything that ships; deny.toml refuses it to every other crate.
[dev-dependencies]
lamfat = "=0.4.3"

# Decompresses tests/fixtures/macos/*.zst, the two images a macOS host wrote. Pure Rust, MIT, and
# a dev-dependency only, like `lamfat`.
ruzstd = "=0.9.1"

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"
